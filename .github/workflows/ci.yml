name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  # ---------------------------------------------------------------------------
  # Rust: format + lint + test + build (mirrors `just ci`)
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (fmt + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: nightly

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: bufbuild/buf-setup-action@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-shear,cargo-sort,typos-cli,rumdl,cargo-workspace-inheritance-check

      # `just ci` is the Rust gate plus the contract lint (`just lint` folds
      # in `buf lint`). The Go, Python and TypeScript SDKs are checked by their
      # own jobs below, each with the toolchain and generated stubs that SDK
      # actually needs.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: just ci

  # ---------------------------------------------------------------------------
  # Proto: buf lint + buf breaking against the PR base.
  #
  # Mirrors `just proto-lint` / `just proto-breaking`. `fetch-depth: 0` so the
  # base ref exists locally for `buf breaking --against`; on push to `main` the
  # comparison is main-vs-main (trivially clean) — the gate exists for PRs.
  # ---------------------------------------------------------------------------
  proto:
    name: Proto (lint + breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: buf lint
        run: just proto-lint

      # A deliberate breaking release is opted in per PR with the
      # `contract-breaking` label: the break inventory is still printed to the
      # log, but the step does not fail, so the PR stays mergeable while
      # remaining fully reviewable. Without the label, any break fails.
      - name: buf breaking
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'contract-breaking') }}
        run: |
          base="${{ github.base_ref }}"
          [ -n "$base" ] || base=main
          just proto-breaking "refs/remotes/origin/$base"

  # ---------------------------------------------------------------------------
  # Go: gofmt + go vet + go build + go test
  #
  # The SDK is stdlib-only and encodes protobuf by hand, so this job needs no
  # `buf generate` step: the tests must stay green in a fresh checkout.
  # ---------------------------------------------------------------------------
  go:
    name: Go (fmt + vet + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted=$(gofmt -l sdks/go)
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: cd sdks/go && go vet ./...

      - name: go build
        run: cd sdks/go && go build ./...

      - name: go test
        run: cd sdks/go && go test ./...

      - name: go test -race
        run: cd sdks/go && go test -race ./...

  # ---------------------------------------------------------------------------
  # Python: ruff format + ruff lint + contract-conformance tests
  # ---------------------------------------------------------------------------
  python:
    name: Python (fmt + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff format check
        run: ruff format --check sdks/python

      - name: ruff lint
        run: ruff check --select E,F sdks/python

      # The tests import the generated stubs, so generation must precede them.
      - uses: bufbuild/buf-setup-action@v1

      # `just sdk-generate` / `just sdk-test-py` below need the runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install test dependencies
        run: |
          pip install pytest protobuf httpx grpcio-tools

      - name: Generate Connect stubs
        run: just sdk-generate

      - name: SDK tests
        run: just sdk-test-py

  # ---------------------------------------------------------------------------
  # TypeScript: prettier + tsc + Node test runner (after stub generation)
  # ---------------------------------------------------------------------------
  typescript:
    name: TypeScript (fmt + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: bufbuild/buf-setup-action@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: cd sdks/typescript && npm ci

      - name: Generate Connect stubs
        run: just sdk-generate

      - name: prettier format check
        run: cd sdks/typescript && npx prettier --check "src/**/*.ts" "examples/**/*.ts" "tests/**/*.ts"

      - name: tsc --noEmit
        run: cd sdks/typescript && npx tsc --noEmit -p tsconfig.json

      - name: SDK tests
        run: just sdk-test-ts

      # Guards the packaging surface: the build config must keep examples and
      # tests out of the published tarball.
      - name: Verify build output excludes examples and tests
        run: |
          cd sdks/typescript
          npm run build
          test ! -d dist/examples
          test ! -d dist/tests
