name: Release

# One workflow covers every language: Rust (crates.io), Python (PyPI),
# TypeScript (npm) and Go (consumed directly from the git tag). Each publish job
# is independent and gated on `gate`, so one language failing does not block the
# others from shipping.
#
# Versioning model: the `vX.Y.Z` tag is the Rust workspace version
# (`[workspace.package] version` in Cargo.toml) — Rust is the source of truth.
# Python (`sdks/python/pyproject.toml`) and TypeScript
# (`sdks/typescript/package.json`) carry their own independent versions and are
# only (re)published when that version is new to the registry, i.e. bump the
# SDK manifest only when the SDK or the contract actually changed. Go has no
# registry version; it is consumed directly from the git tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.3.0)"
        required: true
      force_python:
        description: "Republish the Python SDK even if its version is already on PyPI"
        required: false
        default: false
        type: boolean
      force_typescript:
        description: "Republish the TypeScript SDK even if its version is already on npm"
        required: false
        default: false
        type: boolean

# `contents: write` so the changelog job can create the GitHub release;
# `id-token: write` enables OIDC trusted publishing (PyPI / npm / crates.io)
# when the registry is configured for it.
permissions:
  contents: write
  id-token: write

# Never run two releases for the same tag at once. `github.ref` is the branch
# on workflow_dispatch, so key on the input tag there.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  # ---------------------------------------------------------------------------
  # Gate: the tagged commit must be clean before anything ships.
  # Mirrors `just ci` (fmt + lint + test + build, incl. the buf contract lint)
  # and verifies every language manifest agrees on the version.
  # ---------------------------------------------------------------------------
  gate:
    name: Release gate (CI + version check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # workflow_dispatch passes an explicit tag; a tag push uses github.ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: nightly

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: bufbuild/buf-setup-action@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-shear,cargo-sort,typos-cli,rumdl,cargo-workspace-inheritance-check

      - name: Run CI checks
        run: just ci

      - name: Verify Rust workspace version matches the tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          just check-release-versions "${tag#v}"

  # ---------------------------------------------------------------------------
  # Changelog + GitHub release (git-cliff). Depends on the gate so a broken tag
  # never gets a published release.
  # ---------------------------------------------------------------------------
  changelog:
    name: Changelog + GitHub release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      # `tag_name` is required: on workflow_dispatch `github.ref` is the
      # branch, not the tag, so the default would attach the release to the
      # wrong ref. Prerelease detection reads the tag for the same reason.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'alpha') || contains(github.event.inputs.tag || github.ref_name, 'beta') || contains(github.event.inputs.tag || github.ref_name, 'rc') }}

  # ---------------------------------------------------------------------------
  # Rust: crates.io, in dependency order (contract -> catalog -> proto ->
  # cli -> worker). `just publish-rs` already orders them; this job just runs it.
  # ---------------------------------------------------------------------------
  rust:
    name: Publish Rust crates (crates.io)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Publish to crates.io
        run: just publish-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # Python: PyPI via twine. `just publish-py` regenerates the (gitignored)
  # stubs, builds the sdist+wheel and uploads.
  #
  # The Python SDK is versioned independently from the tag: the upload is
  # skipped when its manifest version is already on PyPI (e.g. a Rust-only
  # release), unless `force_python` is set on a manual dispatch.
  # ---------------------------------------------------------------------------
  python:
    name: Publish Python SDK (PyPI)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: bufbuild/buf-setup-action@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # grpcio-tools is required by `just sdk-generate` (Python stubs).
      - name: Install protobuf tooling
        run: pip install grpcio-tools protobuf

      # The Python SDK has its own version: skip the upload when that version
      # is already on PyPI (Rust-only release), unless forced via dispatch.
      - name: Check if Python SDK version is already published
        id: check
        run: |
          local_v="$(grep -m1 '^version' sdks/python/pyproject.toml | sed -E 's/.*"([0-9][^"]*)".*/\1/')"
          published_v="$(curl -fsSL https://pypi.org/pypi/longtrader-sdk/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || echo unknown)"
          echo "local=$local_v published=$published_v"
          if [ "${{ github.event.inputs.force_python }}" = "true" ]; then
            echo "skip=false (forced)" >> "$GITHUB_OUTPUT"
          elif [ "$published_v" = "$local_v" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish to PyPI
        if: steps.check.outputs.skip != 'true'
        run: just publish-py
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: "1"

  # ---------------------------------------------------------------------------
  # TypeScript: npmjs.com. `just publish-ts` regenerates the stubs, builds and
  # publishes. Auth comes from ~/.npmrc written from NPM_TOKEN.
  #
  # Same independent versioning as Python: skip when the manifest version is
  # already on npm, unless `force_typescript` is set on a manual dispatch.
  # ---------------------------------------------------------------------------
  typescript:
    name: Publish TypeScript SDK (npm)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: bufbuild/buf-setup-action@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Installs the @bufbuild/protoc-gen-es dev dep that `sdk-generate` needs.
      - name: Install Node dependencies
        run: cd sdks/typescript && npm ci

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if TypeScript SDK version is already published
        id: check
        run: |
          local_v="$(node -p "require('./sdks/typescript/package.json').version")"
          published_v="$(npm view @longcipher/longtrader-sdk version 2>/dev/null || echo unknown)"
          echo "local=$local_v published=$published_v"
          if [ "${{ github.event.inputs.force_typescript }}" = "true" ]; then
            echo "skip=false (forced)" >> "$GITHUB_OUTPUT"
          elif [ "$published_v" = "$local_v" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish to npm
        if: steps.check.outputs.skip != 'true'
        run: just publish-ts

  # ---------------------------------------------------------------------------
  # Go: consumed directly from the git tag (module path
  # github.com/longcipher/longtrader/sdks/go), so there is no registry upload.
  # The "release" only verifies the module still builds, vets and tests.
  # ---------------------------------------------------------------------------
  go:
    name: Verify Go SDK at tag
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Verify Go module
        run: just publish-go
