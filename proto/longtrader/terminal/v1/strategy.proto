syntax = "proto3";

package longtrader.terminal.v1;

import "longtrader/stream/v1/stream.proto";
import "longtrader/trading/v1/trading.proto";

// Strategy lifecycle and actions (worker automation).
service StrategyService {
  rpc ListStrategies(ListStrategiesRequest) returns (ListStrategiesResponse);
  rpc StartStrategy(StartStrategyRequest) returns (StrategyStatus);
  rpc PauseStrategy(PauseStrategyRequest) returns (StrategyStatus);
  rpc ResumeStrategy(ResumeStrategyRequest) returns (StrategyStatus);
  rpc StopStrategy(StopStrategyRequest) returns (StrategyStatus);
  rpc GetStrategyStatus(GetStrategyStatusRequest) returns (StrategyStatus);
  rpc SubmitAction(SubmitActionRequest) returns (ActionReceipt);
  rpc StreamStrategyEvents(StreamStrategyEventsRequest) returns (stream StrategyEvent);
  // Strategy descriptor catalog: returns configurable strategy templates (builtin/open-source/custom), UI renders accordingly
  // parameter form (schema-driven), terminal does not need hardcoded UI per strategy.
  rpc ListStrategyDescriptors(ListStrategyDescriptorsRequest) returns (ListStrategyDescriptorsResponse);
}

message StrategyStatus {
  string strategy_id = 1;
  string name = 2;
  string status = 3;   // REGISTERED / RUNNING / PAUSED / STOPPED / ERROR
  string error = 4;
}

message ListStrategiesRequest {}

message ListStrategiesResponse {
  repeated StrategyStatus strategies = 1;
}

message StartStrategyRequest {
  string strategy_id = 1;
  string name = 2;
  // Strategy parameters (JSON string, schema agreed between worker and API).
  string params_json = 3;
}

message PauseStrategyRequest {
  string strategy_id = 1;
}

message ResumeStrategyRequest {
  string strategy_id = 1;
}

message StopStrategyRequest {
  string strategy_id = 1;
  bool cancel_all_orders = 2;
}

message GetStrategyStatusRequest {
  string strategy_id = 1;
}

// ---- Strategy actions ----
//
// Actions reuse the `trading.v1` request shapes rather than redefining a flat
// terminal variant: an action is exactly a venue-scoped trading request bound
// to a strategy, so a second request type would only duplicate the order
// vocabulary (and drift from it).

message SubmitActionRequest {
  string strategy_id = 1;
  oneof action {
    trading.v1.CreateOrderRequest place_order = 10;
    trading.v1.CancelOrderRequest cancel_order = 11;
    trading.v1.CancelAllOrdersRequest cancel_all = 12;
    SetKillSwitch set_kill_switch = 13;
  }
}

message SetKillSwitch {
  bool enabled = 1;
}

message ActionReceipt {
  string strategy_id = 1;
  string receipt_id = 2;
  string message = 3;
}

// Strategy events projected to the terminal UI. Payload entities come from
// `stream.v1` so the UI has one shape per entity regardless of which stream
// it arrived on.
message StrategyEvent {
  string strategy_id = 1;
  string status = 2;          // RUNNING / PAUSED / STOPPED / ERROR
  oneof payload {
    stream.v1.ExecutionReport execution = 10;
    stream.v1.Account account = 11;
    stream.v1.Position position = 12;
    stream.v1.Order order = 13;
  }
  string message = 20;
}

message StreamStrategyEventsRequest {
  repeated string strategy_ids = 1;   // empty = all
}


// ========== Strategy descriptor catalog (schema-driven configuration) ==========

// Declaration of a single parameter slot. UI renders input controls based on this: step determines slider granularity and display
// decimal places, min/max define value range, default is the pre-filled value for new forms.
message ParamSlot {
  // Slot name (form label).
  string label = 1;
  // Dimension: percent / usd / decimal / duration / timestamp.
  string dimension = 2;
  // Lower bound of value range (optional).
  optional double min = 3;
  // Upper bound of value range (optional).
  optional double max = 4;
  // Input grid step (optional, defaults to dimension default).
  optional double step = 5;
  // Pre-filled value for new form (optional).
  optional double default = 6;
}

// A configurable strategy template. Builtin strategies (builtin=true) only allow parameter adjustment,
// structure cannot be modified; custom strategies are created by users.
message StrategyDescriptor {
  // Strategy id, e.g. "grid_maker" / "cmdnc_arb" / user-defined id.
  string id = 1;
  // Display name.
  string name = 2;
  // One-line description (what this strategy does, how to tune parameters).
  string note = 3;
  // Whether it is a builtin strategy (builtin cannot be deleted, structure cannot be modified).
  bool builtin = 4;
  // Parameter slot declarations (index corresponds to strategy parameter array index).
  repeated ParamSlot params = 5;
  // Strategy type: hedge (two-leg combination hedging) / maker (market making) / arb (arbitrage).
  string kind = 6;
}

message ListStrategyDescriptorsRequest {
  // Search by id / name / type (case-insensitive substring), empty string means no filter.
  string search = 1;
  // Whether to only return builtin strategies.
  optional bool builtin_only = 2;
}

message ListStrategyDescriptorsResponse {
  repeated StrategyDescriptor strategies = 1;
}
