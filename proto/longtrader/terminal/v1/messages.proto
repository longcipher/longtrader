syntax = "proto3";

package longtrader.terminal.v1;

import "longtrader/trading/v1/trading.proto";
import "google/protobuf/timestamp.proto";

// ========== Common enums ==========

enum Timeframe {
  TIMEFRAME_UNSPECIFIED = 0;
  TIMEFRAME_S100 = 9;
  TIMEFRAME_S1 = 10;
  TIMEFRAME_M1 = 1;
  TIMEFRAME_M5 = 2;
  TIMEFRAME_M15 = 3;
  TIMEFRAME_M30 = 4;
  TIMEFRAME_H1 = 5;
  TIMEFRAME_H4 = 6;
  TIMEFRAME_D1 = 7;
  TIMEFRAME_W1 = 8;
  // Tick/Volume/Range/Renko are non-time periods aggregated locally, mapped to M1 on wire.
  // Reserved for future parameterized variants.
  reserved 11, 12, 13, 14;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_FILLED = 2;
  ORDER_STATUS_CANCELED = 3;
}

// Classification buckets for stream subscriptions, used for server-side bucketed broadcast (slow clients only affect their subscribed buckets).
enum TopicClass {
  TOPIC_CLASS_UNSPECIFIED = 0;
  TOPIC_CLASS_MARKET_LITE = 1;   // tick / ticker
  TOPIC_CLASS_MARKET_HEAVY = 2;  // book / trade
  TOPIC_CLASS_TRADING = 3;       // position / order / execution / account
  TOPIC_CLASS_RUNTIME = 4;       // runtime_status
  TOPIC_CLASS_FUNDING = 5;       // funding_rate / basis (low frequency)
  TOPIC_CLASS_DERIVATIVES = 6;   // liquidation / open_interest (liquidation peak)
}

// Aggressor direction (foundation of footprint chart correctness; frontend degrades to two-column total when unknown).
enum Aggressor {
  AGGRESSOR_UNSPECIFIED = 0;
  AGGRESSOR_BUY = 1;
  AGGRESSOR_SELL = 2;
  AGGRESSOR_UNKNOWN = 3;
}

// ========== Common messages ==========

// High-precision decimal, carried as string (avoids floating-point precision issues).
message Decimal {
  string value = 1;
}

message Symbol {
  string name = 1;
  string display_name = 2;
  string contract_size = 3;   // string decimal
  string tick_size = 4;       // string decimal
  string base_asset = 5;
  string quote_asset = 6;
}

message Candle {
  int64 timestamp_ms = 1;
  string open = 2;
  string high = 3;
  string low = 4;
  string close = 5;
  string volume = 6;
}

message Tick {
  string symbol = 1;
  string price = 2;
  string volume = 3;
  int64 timestamp_ms = 4;
  string bid = 5;
  string ask = 6;
}

message Ticker {
  string symbol = 1;
  string last = 2;
  string bid = 3;
  string ask = 4;
  string high = 5;
  string low = 6;
  string volume_24h = 7;
  int64 timestamp_ms = 8;
}

message PriceLevel {
  string price = 1;
  string amount = 2;
}

message Book {
  string symbol = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
  int64 timestamp_ms = 4;
  bool snapshot = 5;          // true = full snapshot; false = incremental
}

message Trade {
  string id = 1;
  string symbol = 2;
  Side side = 3;
  string price = 4;
  string amount = 5;
  int64 timestamp_ms = 6;
  bool maker = 7;
  Aggressor aggressor = 8;   // Aggressor direction: Buy/Sell/Unknown (Binance aggTrade m field mapping, see datasource layer)
}

// Liquidation event (unified form after cross-exchange field normalization).
message Liquidation {
  string exchange = 1;
  string symbol = 2;
  Side side = 3;               // Liquidation direction
  string amount = 4;           // Notional value/quantity (decimal)
  string price = 5;            // Liquidation price (decimal)
  int64 timestamp_ms = 6;
}

// Orderbook delta (market maker gateway private stream / depth delta push).
message OrderbookDelta {
  string symbol = 1;
  int64 seq = 2;               // Monotonic sequence; seq gap = data discontinuity → triggers resync
  bool is_snapshot = 3;        // true=full snapshot (rebuild point); false=incremental (qty=0 means delete level)
  repeated PriceLevel bids = 4;
  repeated PriceLevel asks = 5;
}

// Market maker private order projection: gateway-pushed queue position is authoritative (takes precedence over local estimation).
message MyOrderPosition {
  string order_id = 1;
  string symbol = 2;
  Side side = 3;
  string price = 4;            // decimal
  string quantity = 5;         // decimal
  uint32 queue_position = 6;   // Queue position (external authority)
  uint32 total_in_queue = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message FundingRate {
  string symbol = 1;
  string rate = 2;
  int64 next_funding_ts_ms = 3;
  string mark_price = 4;
  // Venue that produced the rate; empty when the request named exactly one.
  // Present because a single `GetFundingRates` call can span venues, and a
  // cross-venue basis comparison is meaningless without attribution.
  string venue = 5;
  // Hours between settlements; 0 when unknown.
  uint32 funding_interval_hours = 6;
  // Absent semantics: empty string when the venue does not report it.
  string open_interest = 7;
  string volume_24h = 8;
}

// One historical funding settlement.
message FundingRatePoint {
  string rate = 1;
  int64 funding_time_ms = 2;
}

// Venue-side conditional (trigger) order resting on the venue's own engine.
message TriggerOrder {
  string id = 1;
  string client_order_id = 2;
  string symbol = 3;
  trading.v1.OrderSide side = 4;
  string trigger_price = 5;
  string qty = 6;
  trading.v1.TriggerPriceType trigger_type = 7;
  optional string order_price = 8;
  OrderType order_type = 9;
  bool reduce_only = 10;
  trading.v1.TriggerOrderStatus status = 11;
  google.protobuf.Timestamp created_at = 12;
  optional string order_id = 13;
  optional google.protobuf.Timestamp triggered_at = 14;
}

message Order {
  string id = 1;
  string symbol = 2;
  Side side = 3;
  OrderType order_type = 4;
  string quantity = 5;
  optional string price = 6;
  optional string take_profit = 7;
  optional string stop_loss = 8;
  string filled_quantity = 9;
  optional string avg_fill_price = 10;
  OrderStatus status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message Position {
  string id = 1;
  string order_id = 2;
  string symbol = 3;
  trading.v1.PositionSide side = 4;
  string quantity = 5;
  string entry_price = 6;
  string current_price = 7;
  string unrealized_pnl = 8;
  optional string take_profit = 9;
  optional string stop_loss = 10;
  google.protobuf.Timestamp opened_at = 11;
}

message ClosedPosition {
  string id = 1;
  string order_id = 2;
  string symbol = 3;
  trading.v1.PositionSide side = 4;
  string quantity = 5;
  string entry_price = 6;
  string exit_price = 7;
  string realized_pnl = 8;
  google.protobuf.Timestamp opened_at = 9;
  google.protobuf.Timestamp closed_at = 10;
  trading.v1.CloseReason close_reason = 11;
}

message Account {
  string balance = 1;
  string equity = 2;
  string margin_used = 3;
  string free_margin = 4;
  string margin_frozen = 5;
}

message ExecutionReport {
  string order_id = 1;
  string symbol = 2;
  Side side = 3;
  OrderStatus status = 4;
  string filled_quantity = 5;
  string price = 6;
  int64 timestamp_ms = 7;
}

message RuntimeStatus {
  string venue = 1;
  bool connected = 2;
  uint64 reconnect_count = 3;
  uint64 lagged_count = 4;
  double place_order_p99_ms = 5;
  double msg_per_sec = 6;
  int64 uptime_secs = 7;
}

// Unified stream message envelope: with type and monotonic sequence.
message UpdateEnvelope {
  uint64 seq = 1;
  TopicClass topic_class = 2;
  oneof payload {
    Tick tick = 10;
    Book book = 11;
    Ticker ticker = 12;
    Trade trade = 13;
    FundingRate funding_rate = 14;
    Liquidation liquidation = 15;
    OrderbookDelta book_delta = 16;
    MyOrderPosition my_order = 17;
    Position position = 20;
    ClosedPosition position_closed = 21;
    Order order = 22;
    ExecutionReport execution = 23;
    Account account = 24;
    RuntimeStatus runtime_status = 30;
  }
}

message StrategyEvent {
  string strategy_id = 1;
  string status = 2;          // RUNNING / PAUSED / STOPPED / ERROR
  oneof payload {
    ExecutionReport execution = 10;
    Account account = 11;
    Position position = 12;
    Order order = 13;
  }
  string message = 20;
}
