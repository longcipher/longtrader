syntax = "proto3";

package longtrader.market.v1;

import "google/protobuf/timestamp.proto";
import "longtrader/common/v1/types.proto";

// ---- Market data messages (unified contract) ----

message Ticker {
  common.v1.EventHeader header = 1;
  string symbol = 2;
  google.protobuf.Timestamp timestamp = 3;
  common.v1.Decimal bid = 4;
  common.v1.Decimal bid_volume = 5;
  common.v1.Decimal ask = 6;
  common.v1.Decimal ask_volume = 7;
  common.v1.Decimal last = 8;
  common.v1.Decimal high = 9;
  common.v1.Decimal low = 10;
  common.v1.Decimal open = 11;
  common.v1.Decimal close = 12;
  common.v1.Decimal base_volume = 13;
  common.v1.Decimal quote_volume = 14;
  common.v1.Decimal change = 15;
  common.v1.Decimal percentage = 16;
  common.v1.Decimal vwap = 17;
  common.v1.Decimal average = 18;
}

message PriceLevel {
  common.v1.Decimal price = 1;
  common.v1.Decimal amount = 2;
}

message OrderBook {
  common.v1.EventHeader header = 1;
  string symbol = 2;
  google.protobuf.Timestamp timestamp = 3;
  repeated PriceLevel bids = 4;
  repeated PriceLevel asks = 5;
}

message PublicTrade {
  common.v1.EventHeader header = 1;
  string id = 2;
  string symbol = 3;
  google.protobuf.Timestamp timestamp = 4;
  TradeSide side = 5;
  common.v1.Decimal price = 6;
  common.v1.Decimal amount = 7;
}

// Side as seen from the taker's perspective.
enum TradeSide {
  TRADE_SIDE_UNSPECIFIED = 0;
  TRADE_SIDE_BUY = 1;
  TRADE_SIDE_SELL = 2;
}

message OHLCV {
  common.v1.EventHeader header = 1;
  google.protobuf.Timestamp timestamp = 2;
  common.v1.Decimal open = 3;
  common.v1.Decimal high = 4;
  common.v1.Decimal low = 5;
  common.v1.Decimal close = 6;
  common.v1.Decimal volume = 7;
}

// ---- Streaming ----

enum StreamChannel {
  STREAM_CHANNEL_UNSPECIFIED = 0;
  STREAM_CHANNEL_TICKER = 1;
  STREAM_CHANNEL_ORDERBOOK = 2;
  STREAM_CHANNEL_TRADES = 3;
  STREAM_CHANNEL_OHLCV = 4;
}

message StreamSubscription {
  StreamChannel channel = 1;
  string symbol = 2;
  map<string, string> params = 3;
}

message StreamMarketDataRequest {
  common.v1.ExchangeId exchange_id = 1;
  repeated StreamSubscription subscriptions = 2;
  // Opaque token from a previous stream's last event; empty starts fresh.
  string resume_token = 3;
}

// One streamed market data event. `sequence` inside `header` increments by 1
// per subscription; a detected gap requires snapshot resync (orderbook) or
// reconciliation (private streams).
message MarketDataEvent {
  common.v1.EventHeader header = 1;
  oneof event {
    Ticker ticker = 2;
    OrderBook orderbook = 3;
    PublicTrade trade = 4;
    OHLCV ohlcv = 5;
  }
  // Opaque cursor for reconnect-with-replay.
  string resume_token = 6;
}

// Aggregation interval for candle and other time-series requests.
//
// The single authority for timeframes across the contract: terminal, strategy
// and backtest surfaces all reference this enum rather than redefining their
// own. Non-time periods (tick / volume / range / renko) are aggregated locally
// and mapped onto M1, so their numbers are reserved rather than assigned.
enum Timeframe {
  TIMEFRAME_UNSPECIFIED = 0;
  TIMEFRAME_S100 = 9;
  TIMEFRAME_S1 = 10;
  TIMEFRAME_M1 = 1;
  TIMEFRAME_M5 = 2;
  TIMEFRAME_M15 = 3;
  TIMEFRAME_M30 = 4;
  TIMEFRAME_H1 = 5;
  TIMEFRAME_H4 = 6;
  TIMEFRAME_D1 = 7;
  TIMEFRAME_W1 = 8;
  reserved 11, 12, 13, 14;
}

// OHLCV candle. `timestamp_ms` is Unix milliseconds — the event-time convention
// for candles (snapshot messages such as Ticker/Order use google.protobuf.Timestamp;
// see docs/contract-style-guide.md §Timestamps).
message Candle {
  int64 timestamp_ms = 1;
  common.v1.Decimal open = 2;
  common.v1.Decimal high = 3;
  common.v1.Decimal low = 4;
  common.v1.Decimal close = 5;
  common.v1.Decimal volume = 6;
}

// ---- Unary fetches (unified surface) ----

message FetchTickerRequest {
  common.v1.ExchangeId exchange_id = 1;
  string symbol = 2;
}

message FetchTickerResponse {
  Ticker ticker = 1;
}

message FetchOrderBookRequest {
  common.v1.ExchangeId exchange_id = 1;
  string symbol = 2;
  common.v1.Pagination pagination = 3;
}

message FetchOrderBookResponse {
  OrderBook orderbook = 1;
  common.v1.Page page = 2;
}

message GetCandlesRequest {
  common.v1.ExchangeId exchange_id = 1;
  string symbol = 2;
  // Aggregation interval; `TIMEFRAME_UNSPECIFIED` defaults to M1 server-side.
  Timeframe timeframe = 3;
  common.v1.Pagination pagination = 4;
  // Inclusive time window, Unix milliseconds. Absent means "open at that end",
  // which is the common case (latest page, or everything since a cursor), but a
  // chart loading a historical window needs both bounds and `Pagination.since`
  // alone cannot express the upper one.
  optional int64 start_ms = 5;
  optional int64 end_ms = 6;
}

message GetCandlesResponse {
  repeated Candle candles = 1;
  common.v1.Page page = 2;
}

// Instrument metadata for one tradable symbol.
message SymbolInfo {
  // Unique symbol identifier (e.g. "BTCUSDT").
  string name = 1;
  // Human-readable display name.
  string display_name = 2;
  string base_asset = 3;
  string quote_asset = 4;
  common.v1.Decimal contract_size = 5;
  // Minimum price increment.
  common.v1.Decimal tick_size = 6;
}

message ListSymbolsRequest {
  common.v1.ExchangeId exchange_id = 1;
}

message ListSymbolsResponse {
  repeated SymbolInfo symbols = 1;
}

message SearchSymbolsRequest {
  common.v1.ExchangeId exchange_id = 1;
  // Case-insensitive substring matched against name / display name.
  string query = 2;
  common.v1.Pagination pagination = 3;
}

message SearchSymbolsResponse {
  repeated SymbolInfo symbols = 1;
  common.v1.Page page = 2;
}

// ---- Batch ticker snapshots ----

message ListTickersRequest {
  common.v1.ExchangeId exchange_id = 1;
  // Empty lists every symbol the exchange reports.
  repeated string symbols = 2;
}

message ListTickersResponse {
  repeated Ticker tickers = 1;
}

// ---- Perpetual funding rates ----

// Current funding rate for one perpetual contract.
message FundingRate {
  string symbol = 1;
  // Current rate, as a signed fraction of notional (0.0001 = 0.01%).
  common.v1.Decimal rate = 2;
  // When the next funding settles, Unix milliseconds.
  int64 next_funding_time_ms = 3;
  // Absent when the venue does not report a mark price.
  optional common.v1.Decimal mark_price = 4;
  // Hours between settlements; 0 when unknown.
  uint32 funding_interval_hours = 5;
  // Absent when the venue does not report open interest.
  optional common.v1.Decimal open_interest = 6;
  // Absent when the venue does not report 24h volume.
  optional common.v1.Decimal volume_24h = 7;
  // Venue that produced the rate. Absent when the request named exactly one
  // exchange; present on batch calls that span venues, because a cross-venue
  // basis comparison is meaningless without attribution.
  optional common.v1.ExchangeId exchange_id = 8;
}

// One historical funding settlement.
message FundingRatePoint {
  common.v1.Decimal rate = 1;
  // Settlement time, Unix milliseconds.
  int64 funding_time_ms = 2;
}

message FetchFundingRateRequest {
  common.v1.ExchangeId exchange_id = 1;
  string symbol = 2;
}

message FetchFundingRateResponse {
  // Absent when the venue has no funding data for the symbol.
  optional FundingRate funding_rate = 1;
}

message FetchFundingRateHistoryRequest {
  common.v1.ExchangeId exchange_id = 1;
  string symbol = 2;
  // Maximum points to return, newest first. Bounded server-side.
  uint32 limit = 3;
}

message FetchFundingRateHistoryResponse {
  repeated FundingRatePoint points = 1;
}

message ListFundingRatesRequest {
  common.v1.ExchangeId exchange_id = 1;
  // Empty lists every symbol the exchange reports funding for.
  repeated string symbols = 2;
}

message ListFundingRatesResponse {
  repeated FundingRate funding_rates = 1;
}

// ---- Unified market data service ----
//
// Served by the worker as a thin proxy over its backend adapter, and (after
// convergence) natively by the terminal API.

service MarketDataService {
  rpc FetchTicker(FetchTickerRequest) returns (FetchTickerResponse);
  rpc ListTickers(ListTickersRequest) returns (ListTickersResponse);
  rpc FetchOrderBook(FetchOrderBookRequest) returns (FetchOrderBookResponse);
  rpc GetCandles(GetCandlesRequest) returns (GetCandlesResponse);
  rpc ListSymbols(ListSymbolsRequest) returns (ListSymbolsResponse);
  rpc SearchSymbols(SearchSymbolsRequest) returns (SearchSymbolsResponse);
  // Perpetual funding: current rate and settlement history.
  rpc FetchFundingRate(FetchFundingRateRequest) returns (FetchFundingRateResponse);
  rpc ListFundingRates(ListFundingRatesRequest) returns (ListFundingRatesResponse);
  rpc FetchFundingRateHistory(FetchFundingRateHistoryRequest) returns (FetchFundingRateHistoryResponse);
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc StreamMarketData(StreamMarketDataRequest) returns (stream MarketDataEvent);
}
