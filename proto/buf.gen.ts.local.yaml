version: v2
# Local TypeScript codegen using the repo-local protoc-gen-es (offline-safe).
# Generated by scripts/gen-proto.sh; do not commit hand edits.
# NOTE: path is overwritten by scripts/gen-proto.sh on each run; this
# placeholder keeps the repo self-contained without absolute host paths.
clean: true
plugins:
  - local: ["node", "../sdks/typescript/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es"]
    out: ../sdks/typescript/src/gen
