version: v2
modules:
  - path: .
lint:
  except:
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_STANDARD_NAME
    - PACKAGE_VERSION_SUFFIX
    # HedgeUnit / StrategyStatus are intentionally returned by multiple CRUD
    # RPCs (resource-as-response, like a REST resource body). Renaming each into
    # a per-RPC wrapper would be wire-compatible but would break the worker and
    # every SDK client for zero behavioral gain, so the rule is disabled by
    # policy. See docs/contract-style-guide.md §6.
    - RPC_REQUEST_RESPONSE_UNIQUE
  use:
    - STANDARD
breaking:
  # NOTE: RPC_REQUEST_STANDARD_NAME / RPC_RESPONSE_STANDARD_NAME /
  # PACKAGE_VERSION_SUFFIX are LINT-only rules and are intentionally NOT listed
  # here — none of them is a valid `breaking` rule, and including any made
  # `buf breaking` abort before reporting real wire breaks.
  #
  # WIRE_JSON alone does NOT catch structural deletions: MESSAGE_NO_DELETE,
  # ENUM_NO_DELETE, SERVICE_NO_DELETE, RPC_NO_DELETE, ONEOF_NO_DELETE and
  # FIELD_NO_DELETE are FILE-category rules only (verified with
  # `buf config ls-breaking-rules`), so `buf breaking` used to stay green while
  # whole messages were being deleted. Add FILE so the gate actually enforces
  # interface stability; WIRE_JSON still contributes the wire/JSON
  # compatibility rules and the reserved-range rules that FILE does not carry.
  use:
    - WIRE_JSON
    - FILE
