version: v2
# Generates stubs for the SDK tiers. Run via `just sdk-generate` (requires
# network access for remote plugins).
managed:
  enabled: true
  override:
    # Go has no default in managed mode: without this, protoc-gen-go fails
    # ("go_package is required") and buf aborts the whole generate run, so the
    # Go output silently disappears. Setting the prefix here keeps
    # go_package out of the language-neutral .proto files.
    - file_option: go_package_prefix
      value: github.com/longcipher/longtrader/sdks/go/gen
plugins:
  - remote: buf.build/protocolbuffers/python:v31.1
    out: ../sdks/python/longtrader_sdk/proto
  - remote: buf.build/community/grpcio-python:v1.73.1
    out: ../sdks/python/longtrader_sdk/proto
  - remote: buf.build/bufbuild/es:v2.10.1
    out: ../sdks/typescript/src/gen
    opt:
      - target=typescript
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: ../sdks/go/gen
    opt:
      - paths=source_relative
