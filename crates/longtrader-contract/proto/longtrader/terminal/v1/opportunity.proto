syntax = "proto3";

package longtrader.terminal.v1;

import "google/protobuf/timestamp.proto";

import "longtrader/common/v1/types.proto";
import "longtrader/terminal/v1/hedge.proto";

// ========== Opportunity ==========
//
// Cross-exchange same-underlying pairing (two-leg combination), with real-time spread / funding rate diff readings and metric values, UI's
// "Opportunity page" sorts, filters, and highlights based on this (corresponds to QQQ opportunity page: cross-exchange pairing same underlying, metrics
// sorting + threshold filtering).
message Opportunity {
  string id = 1;
  // Same underlying.
  string underlying = 2;
  HedgeLeg long_leg = 3;
  HedgeLeg short_leg = 4;
  // Empty leg exchange rate.
  double scale = 5;
  // Cross-exchange basis (ratio).
  double basis = 6;
  // Funding rate diff (empty leg rate - multi leg rate, ratio).
  double funding_rate_diff = 7;
  // Open action side executable spread.
  double open_spread = 8;
  // Close action side executable spread.
  double close_spread = 9;
  // Metric readings (metric id → value), used for sorting and display.
  repeated MetricValue metrics = 10;
  // Matched threshold id (for highlighting).
  repeated string hit_thresholds = 11;
  // Current total notional (0 = no position).
  common.v1.Decimal current_notional = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// Single metric reading (metric id → value). repeated instead of map, to avoid different hasher characteristics
// causing cross-crate HashMap type mismatch on generated types.
message MetricValue {
  string id = 1;
  double value = 2;
}

message ListOpportunitiesRequest {
  // Search by underlying / leg symbol (case-insensitive substring).
  string search = 1;
  // Sort field: basis / funding_rate_diff / open_spread / close_spread.
  string sort_by = 2;
  // Sort direction: asc / desc.
  string sort_dir = 3;
  // Only keep opportunities matching these thresholds.
  repeated string threshold_ids = 4;
  // Only keep opportunities with no position.
  bool only_new = 5;
}

message ListOpportunitiesResponse {
  repeated Opportunity opportunities = 1;
}

service OpportunityService {
  rpc ListOpportunities(ListOpportunitiesRequest) returns (ListOpportunitiesResponse);
}
