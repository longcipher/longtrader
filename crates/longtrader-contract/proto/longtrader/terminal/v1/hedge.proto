syntax = "proto3";

package longtrader.terminal.v1;

import "google/protobuf/timestamp.proto";
import "longtrader/common/v1/types.proto";

// Nullable parameter values (proto3 repeated has no null, use explicit container to express).
//
// A parameter is a knob (percent / multiple / duration), not an amount, so it
// stays `double`; only money / price / quantity / PnL fields use `Decimal`.
message ParamValue {
  optional double value = 1;
}

// ========== Hedge Unit contract ==========
//
// Hedge unit is the accounting unit for strategy execution: two legs (long/short) cross-exchange pairing, strategy
// expression outputs target notional, execution engine maintains two-leg position at this value. UI's "strategy
// detail page" is organized by hedge unit (one page per unit: config + runtime tracking + arbitrage).

// One leg of a hedge unit.
message HedgeLeg {
  // Exchange (venue) the leg trades on.
  common.v1.ExchangeId exchange_id = 1;
  // Exchange native symbol.
  string symbol = 2;
  // Leg direction: LONG / SHORT.
  string side = 3;
}

// One rebalance record (strategy rebalance or price drift rebalance).
message Adjustment {
  string id = 1;
  // Millisecond timestamp.
  int64 timestamp_ms = 2;
  // Rebalance type: STRATEGY (strategy rebalance) / DRIFT (price drift rebalance) / MANUAL (manual).
  string kind = 3;
  // Audit text: expression substituted with current actual values.
  string expression = 4;
  // Target notional (quote amount).
  common.v1.Decimal target_notional = 5;
  // Target quantity (multi leg units, signed).
  common.v1.Decimal target_quantity = 6;
  // Pre-rebalance notional (optional).
  optional common.v1.Decimal from_notional = 7;
}

// Arbitrage snapshot: real-time spread/funding rate readings for one leg pair, for "arbitrage display area" rendering.
//
// Basis / spread / deviation / risk fields are normalized ratios, not amounts,
// so they stay `double`; only the notional and PnL fields are decimal money.
message ArbitrageSnapshot {
  // Cross-exchange basis (spot vs perp price difference, mean-normalized ratio).
  double basis = 1;
  // Funding rate diff (empty leg rate - multi leg rate, ratio).
  double funding_rate_diff = 2;
  // Open action side executable spread (multi leg takes ask, empty leg takes bid).
  double open_spread = 3;
  // Close action side executable spread (multi leg takes bid, empty leg takes ask).
  double close_spread = 4;
  // Open threshold line (strategy custom, spread crosses above to open).
  double open_line = 5;
  // Close threshold line (strategy custom, spread crosses below to close).
  double close_line = 6;
  // Current total two-leg notional (quote amount).
  common.v1.Decimal current_notional = 7;
  // Strategy target notional (quote amount).
  common.v1.Decimal target_notional = 8;
  // Net P&L (spread P&L + funding rate net income - fees, quote).
  common.v1.Decimal net_pnl = 9;
  // Realized P&L (quote).
  common.v1.Decimal realized_pnl = 10;
  // Cumulative funding rate net income (quote).
  common.v1.Decimal funding_accrued = 11;
  // Cumulative fees (quote).
  common.v1.Decimal fees_paid = 12;
  // Multi leg quantity deviation ((actual-target)/target).
  double long_deviation = 13;
  // Empty leg quantity deviation.
  double short_deviation = 14;
  // Multi leg liquidation proximity [0,1].
  double long_liq_risk = 15;
  // Empty leg liquidation proximity [0,1].
  double short_liq_risk = 16;
  // Snapshot time (milliseconds).
  int64 timestamp_ms = 17;
}

// Hedge unit status.
message HedgeUnit {
  string id = 1;
  // Display name.
  string name = 2;
  HedgeLeg long_leg = 3;
  HedgeLeg short_leg = 4;
  // Empty leg exchange rate: empty leg price family × scale converted to multi leg units.
  double scale = 5;
  // Bound strategy id (see StrategyDescriptor).
  string strategy_id = 6;
  // Parameter values, aligned with descriptor's params slots; null = slot not filled.
  repeated ParamValue params = 7;
  // Status: RUNNING / REDUCE_ONLY / DISABLED / CLOSED.
  string status = 8;
  // Target notional (quote amount).
  common.v1.Decimal target_notional = 9;
  // Target quantity (multi leg units, signed).
  common.v1.Decimal target_quantity = 10;
  // Multi leg actual position quantity.
  common.v1.Decimal long_quantity = 11;
  // Empty leg actual position quantity (converted to multi leg units, negative when signed).
  common.v1.Decimal short_quantity = 12;
  // Recent rebalance records (sorted by time descending, max 50 kept).
  repeated Adjustment adjustments = 13;
  // Latest arbitrage snapshot (optional).
  optional ArbitrageSnapshot arbitrage = 14;
  // Open time.
  google.protobuf.Timestamp opened_at = 15;
  // Last update time.
  google.protobuf.Timestamp updated_at = 16;
}

// Hedge unit real-time events (stream).
message HedgeUnitEvent {
  oneof payload {
    // Unit overall status update (including target/actual positions, status, latest arbitrage snapshot).
    HedgeUnit unit = 1;
    // New rebalance record.
    Adjustment adjustment = 2;
    // Arbitrage snapshot update (high frequency, independent of unit low-frequency status).
    ArbitrageSnapshot arbitrage = 3;
  }
}

// ========== Hedge unit services ==========

message ListHedgeUnitsRequest {
  // Search by name / leg symbol (case-insensitive substring), empty string means no filter.
  string search = 1;
  // Status whitelist (RUNNING / REDUCE_ONLY / DISABLED / CLOSED), empty array means no filter.
  repeated string statuses = 2;
  // Strategy id whitelist, empty array means no filter.
  repeated string strategy_ids = 3;
}

message ListHedgeUnitsResponse {
  repeated HedgeUnit units = 1;
}

message GetHedgeUnitRequest {
  string id = 1;
}

message CreateHedgeUnitRequest {
  string name = 1;
  HedgeLeg long_leg = 2;
  HedgeLeg short_leg = 3;
  double scale = 4;
  string strategy_id = 5;
  repeated ParamValue params = 6;
  // Initial status: RUNNING / REDUCE_ONLY / DISABLED.
  string status = 7;
}

message UpdateHedgeUnitRequest {
  string id = 1;
  string name = 2;
  double scale = 3;
  string strategy_id = 4;
  repeated ParamValue params = 5;
  string status = 6;
}

message DeleteHedgeUnitRequest {
  string id = 1;
}

message DeleteHedgeUnitResponse {}

message SetHedgeUnitStatusRequest {
  string id = 1;
  string status = 2;  // RUNNING / REDUCE_ONLY / DISABLED
}

message StreamHedgeUnitEventsRequest {
  // Subscribed hedge unit ids; empty = all.
  repeated string hedge_unit_ids = 1;
}

service HedgeUnitService {
  rpc ListHedgeUnits(ListHedgeUnitsRequest) returns (ListHedgeUnitsResponse);
  rpc GetHedgeUnit(GetHedgeUnitRequest) returns (HedgeUnit);
  rpc CreateHedgeUnit(CreateHedgeUnitRequest) returns (HedgeUnit);
  rpc UpdateHedgeUnit(UpdateHedgeUnitRequest) returns (HedgeUnit);
  rpc DeleteHedgeUnit(DeleteHedgeUnitRequest) returns (DeleteHedgeUnitResponse);
  rpc SetHedgeUnitStatus(SetHedgeUnitStatusRequest) returns (HedgeUnit);
  // Hedge unit real-time event stream (status / rebalance / arbitrage snapshot).
  rpc StreamHedgeUnitEvents(StreamHedgeUnitEventsRequest) returns (stream HedgeUnitEvent);
}
