syntax = "proto3";

package longtrader.terminal.v1;

import "google/protobuf/timestamp.proto";
import "longtrader/common/v1/types.proto";

import "longtrader/terminal/v1/strategy.proto";
import "longtrader/terminal/v1/hedge.proto";

// ========== Metric configuration ==========
//
// Metrics are computable quantities (cross-exchange basis, funding rate diff, CVD ...). Strategy expressions and thresholds both reference
// metric id. QQQ's "metric CRUD + dimension" corresponds to this contract.
message Metric {
  // Metric id, e.g. "basis" / "funding_rate_diff".
  string id = 1;
  // Display name.
  string name = 2;
  // Dimension: percent / usd / decimal / duration / timestamp.
  string dimension = 3;
  // Computation expression (can reference other metric ids / price sources).
  string expression = 4;
  // Description.
  string note = 5;
}

message ListMetricsRequest {
  // Search by id / name (case-insensitive substring), empty string means no filter.
  string search = 1;
}
message ListMetricsResponse {
  repeated Metric metrics = 1;
}
message UpsertMetricRequest {
  // Empty id = create new; otherwise overwrite.
  Metric metric = 1;
}
message DeleteMetricRequest {
  string id = 1;
}
message DeleteMetricResponse {}

// ========== Threshold configuration ==========
//
// Thresholds compare against metrics, matches can trigger notifications. UI's "Opportunity page" uses it to filter and highlight opportunities,
// threshold CRUD + notification toggle corresponds to QQQ's "threshold management".
message Threshold {
  string id = 1;
  string name = 2;
  // Metric id being compared.
  string metric_id = 3;
  // Comparison operator: GT / GTE / LT / LTE / EQ.
  string operator = 4;
  // Threshold line.
  double value = 5;
  // Whether to notify on match.
  bool notify_enabled = 6;
  // Notification channel id: lark / bark / telegram.
  repeated string notify_channels = 7;
  string note = 8;
}

message ListThresholdsRequest {
  string search = 1;
}
message ListThresholdsResponse {
  repeated Threshold thresholds = 1;
}
message UpsertThresholdRequest {
  Threshold threshold = 1;
}
message DeleteThresholdRequest {
  string id = 1;
}
message DeleteThresholdResponse {}

// ========== Custom strategy template CRUD ==========
//
// Isomorphic to builtin `StrategyDescriptor` (parameter slot schema-driven form), but by users
// create / edit / delete; builtin strategies cannot be modified.
message StrategyTemplate {
  string id = 1;
  string name = 2;
  // Strategy expression (can reference metric ids and parameter slot names).
  string expression = 3;
  repeated ParamSlot params = 4;
  string kind = 5;
  string note = 6;
}

message ListStrategyTemplatesRequest {
  string search = 1;
}
message ListStrategyTemplatesResponse {
  repeated StrategyTemplate templates = 1;
}
message UpsertStrategyTemplateRequest {
  StrategyTemplate template = 1;
}
message DeleteStrategyTemplateRequest {
  string id = 1;
}
message DeleteStrategyTemplateResponse {}

// ========== Expression trial calculation ==========
//
// Key part of configuration experience: before saving, substitute current price / parameters in editor to see results.
message EvaluateExpressionRequest {
  // Strategy expression (e.g. "basis * 100" / "open_spread - open_line").
  string expression = 1;
  // Multi leg price (quote; optional, default 0).
  optional common.v1.Decimal long_price = 2;
  // Empty leg price (quote; optional, default 0).
  optional common.v1.Decimal short_price = 3;
  // Empty leg exchange rate (empty leg price family × scale converted to multi leg units).
  double scale = 4;
  // Parameter slot values (aligned by index).
  repeated ParamValue params = 5;
}
message EvaluateExpressionResponse {
  // Trial calculation result.
  double result = 1;
  // Readable expression after substitution (audit text).
  string evaluated_expression = 2;
}

// ========== Notification center ==========
//
// Channel-level configuration + test send + history (corresponds to QQQ notification center: lark / bark /
// telegram + cooldown + test).
message NotificationChannel {
  // Channel id: lark / bark / telegram.
  string id = 1;
  string name = 2;
  bool enabled = 3;
  // Channel configuration (webhook / token ...), per channel convention.
  string config_json = 4;
}
message ListNotificationChannelsRequest {}
message ListNotificationChannelsResponse {
  repeated NotificationChannel channels = 1;
}
message UpsertNotificationChannelRequest {
  NotificationChannel channel = 1;
}
message TestNotificationRequest {
  string channel = 1;
}
message TestNotificationResponse {
  bool ok = 1;
  string message = 2;
}
message NotificationRecord {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string title = 3;
  string body = 4;
  string channel = 5;
  // SENT / FAILED.
  string status = 6;
}
message ListNotificationsRequest {
  common.v1.Pagination pagination = 1;
}
message ListNotificationsResponse {
  repeated NotificationRecord records = 1;
  common.v1.Page page = 2;
}

// ========== Episode records ==========
//
// Complete accounting for one open → close cycle: spread P&L + funding rate net income − fees, including per-trade
// details (corresponds to QQQ's "episode records").
message EpisodeFill {
  google.protobuf.Timestamp timestamp = 1;
  common.v1.Decimal price = 2;
  common.v1.Decimal quantity = 3;
  common.v1.Decimal fee = 4;
}
message Episode {
  string id = 1;
  string hedge_unit_id = 2;
  google.protobuf.Timestamp opened_at = 3;
  // 0 = no position.
  google.protobuf.Timestamp closed_at = 4;
  // Spread P&L (quote).
  common.v1.Decimal spread_pnl = 5;
  // Funding rate net income (quote).
  common.v1.Decimal funding_accrued = 6;
  // Cumulative fees (quote).
  common.v1.Decimal fees_paid = 7;
  // Net P&L = spread P&L + funding rate net income − fees.
  common.v1.Decimal net_pnl = 8;
  // Multi leg per-trade execution.
  repeated EpisodeFill long_fills = 9;
  // Empty leg per-trade execution.
  repeated EpisodeFill short_fills = 10;
  // OPEN / CLOSED.
  string status = 11;
}
message ListEpisodesRequest {
  string hedge_unit_id = 1;
  common.v1.Pagination pagination = 2;
}
message ListEpisodesResponse {
  repeated Episode episodes = 1;
  common.v1.Page page = 2;
}

// ========== Session / Token (pairing code + QR code) ==========
//
// Mobile / remote Web UI pairs with terminal session via pairing code + QR code (corresponds to QQQ's
// "Session / Token" page).
message SessionInfo {
  string session_id = 1;
  // Pairing code (short code, manual input).
  string pairing_code = 2;
  // QR code payload (URL / token).
  string qr_payload = 3;
  google.protobuf.Timestamp expires_at = 4;
  repeated string devices = 5;
}
message GetSessionRequest {}
message GetSessionResponse {
  SessionInfo session = 1;
}
message RotateSessionRequest {}
message RotateSessionResponse {
  SessionInfo session = 1;
}

// ========== Services ==========
service StrategyConfigService {
  // Metric CRUD.
  rpc ListMetrics(ListMetricsRequest) returns (ListMetricsResponse);
  rpc UpsertMetric(UpsertMetricRequest) returns (Metric);
  rpc DeleteMetric(DeleteMetricRequest) returns (DeleteMetricResponse);
  // Threshold CRUD.
  rpc ListThresholds(ListThresholdsRequest) returns (ListThresholdsResponse);
  rpc UpsertThreshold(UpsertThresholdRequest) returns (Threshold);
  rpc DeleteThreshold(DeleteThresholdRequest) returns (DeleteThresholdResponse);
  // Custom strategy template CRUD.
  rpc ListStrategyTemplates(ListStrategyTemplatesRequest) returns (ListStrategyTemplatesResponse);
  rpc UpsertStrategyTemplate(UpsertStrategyTemplateRequest) returns (StrategyTemplate);
  rpc DeleteStrategyTemplate(DeleteStrategyTemplateRequest) returns (DeleteStrategyTemplateResponse);
  // Expression trial calculation.
  rpc EvaluateExpression(EvaluateExpressionRequest) returns (EvaluateExpressionResponse);
  // Notification channels and records.
  rpc ListNotificationChannels(ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse);
  rpc UpsertNotificationChannel(UpsertNotificationChannelRequest) returns (NotificationChannel);
  rpc TestNotification(TestNotificationRequest) returns (TestNotificationResponse);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  // Episode records.
  rpc ListEpisodes(ListEpisodesRequest) returns (ListEpisodesResponse);
  // Session / Token.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc RotateSession(RotateSessionRequest) returns (RotateSessionResponse);
}
