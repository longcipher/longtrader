syntax = "proto3";

package longtrader.terminal.v1;

import "longtrader/stream/v1/stream.proto";

// Runtime state and subscriptions.
//
// `StreamUpdates` deliberately reuses `stream.v1`: it is the same envelope the
// worker's `StreamService` emits, so there is exactly one streaming contract
// and clients branch on `TopicClass` rather than on which service they called.
service RuntimeService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ListVenues(ListVenuesRequest) returns (ListVenuesResponse);
  // `stream` is the streaming keyword, so the type must be fully qualified.
  rpc StreamUpdates(.longtrader.stream.v1.StreamUpdatesRequest)
      returns (stream .longtrader.stream.v1.UpdateEnvelope);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  int64 uptime_secs = 2;
  repeated VenueStatus venues = 3;
}

message VenueStatus {
  string name = 1;
  bool connected = 2;
  uint64 symbol_count = 3;
}

message ListVenuesRequest {}

message ListVenuesResponse {
  repeated VenueStatus venues = 1;
}
