syntax = "proto3";

package longtrader.stream.v1;

import "longtrader/common/v1/types.proto";
import "longtrader/market/v1/market.proto";
import "longtrader/trading/v1/trading.proto";
import "google/protobuf/timestamp.proto";

// Unified real-time streaming contract.
//
// One server-streaming RPC fans every update class (market data, private
// trading, account, runtime) to a consumer as tagged `UpdateEnvelope` messages.
// Values use `common.v1.Decimal` (dual representation); entity lifecycle
// times use `google.protobuf.Timestamp` and high-frequency event times use
// `int64 *_ms` (Unix milliseconds). Reconnect/replay is negotiated through
// the envelope's `resume_token`.
//
// This is the single streaming contract for the whole product: the terminal
// runtime stream and the worker stream are the same envelope, differing only
// in which `TopicClass` buckets the caller subscribes to.

// Side as seen from the taker's perspective (public trades, liquidations,
// own-order projections). `UNKNOWN` degrades consumers to two-column totals.
enum TradeSide {
  TRADE_SIDE_UNSPECIFIED = 0;
  TRADE_SIDE_BUY = 1;
  TRADE_SIDE_SELL = 2;
  TRADE_SIDE_UNKNOWN = 3;
}

// Classification buckets for stream subscriptions, used for server-side
// bucketed broadcast (a slow client only stalls its own subscribed buckets).
enum TopicClass {
  TOPIC_CLASS_UNSPECIFIED = 0;
  // tick / ticker.
  TOPIC_CLASS_MARKET_LITE = 1;
  // book / trade.
  TOPIC_CLASS_MARKET_HEAVY = 2;
  // position / order / execution / account.
  TOPIC_CLASS_TRADING = 3;
  // runtime_status.
  TOPIC_CLASS_RUNTIME = 4;
  // funding_rate / basis (low frequency).
  TOPIC_CLASS_FUNDING = 5;
  // liquidation / open_interest (liquidation peak).
  TOPIC_CLASS_DERIVATIVES = 6;
}

// Best bid/ask + last trade snapshot for one symbol.
message Tick {
  string symbol = 1;
  common.v1.Decimal last = 2;
  common.v1.Decimal bid = 3;
  common.v1.Decimal ask = 4;
  common.v1.Decimal volume = 5;
  int64 timestamp_ms = 6;
}

// One price level in an order book.
message BookLevel {
  common.v1.Decimal price = 1;
  common.v1.Decimal amount = 2;
}

// Full order book snapshot for one symbol.
message BookSnapshot {
  string symbol = 1;
  repeated BookLevel bids = 2;
  repeated BookLevel asks = 3;
  int64 timestamp_ms = 4;
  // True when this is a full snapshot; false marks an incremental update.
  bool snapshot = 5;
}

// Public trade print with aggressor direction.
message Trade {
  string id = 1;
  string symbol = 2;
  TradeSide side = 3;
  common.v1.Decimal price = 4;
  common.v1.Decimal amount = 5;
  int64 timestamp_ms = 6;
  bool maker = 7;
}

// Liquidation event (derivatives).
message Liquidation {
  string exchange = 1;
  string symbol = 2;
  TradeSide side = 3;
  common.v1.Decimal amount = 4;
  common.v1.Decimal price = 5;
  int64 timestamp_ms = 6;
}

// Order-book incremental update (qty=0 removes a level). A gap in `seq`
// means data discontinuity and requires a snapshot resync.
message OrderbookDelta {
  string symbol = 1;
  uint64 seq = 2;
  bool is_snapshot = 3;
  repeated BookLevel bids = 4;
  repeated BookLevel asks = 5;
}

// Own (market-making) order projection; the gateway-pushed queue position
// is authoritative over local estimation.
message MyOrderPosition {
  string order_id = 1;
  string symbol = 2;
  TradeSide side = 3;
  common.v1.Decimal price = 4;
  common.v1.Decimal quantity = 5;
  uint32 queue_position = 6;
  uint32 total_in_queue = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Account margin snapshot.
message Account {
  common.v1.Decimal balance = 1;
  common.v1.Decimal equity = 2;
  common.v1.Decimal margin_used = 3;
  common.v1.Decimal free_margin = 4;
  common.v1.Decimal margin_frozen = 5;
}

// Open position projection.
message Position {
  string id = 1;
  string order_id = 2;
  string symbol = 3;
  trading.v1.PositionSide side = 4;
  common.v1.Decimal quantity = 5;
  common.v1.Decimal entry_price = 6;
  common.v1.Decimal current_price = 7;
  common.v1.Decimal unrealized_pnl = 8;
  common.v1.Decimal take_profit = 9;
  common.v1.Decimal stop_loss = 10;
  google.protobuf.Timestamp opened_at = 11;
}

// Recently closed position with its realized outcome.
message ClosedPosition {
  string id = 1;
  string order_id = 2;
  string symbol = 3;
  trading.v1.PositionSide side = 4;
  common.v1.Decimal quantity = 5;
  common.v1.Decimal entry_price = 6;
  common.v1.Decimal exit_price = 7;
  common.v1.Decimal realized_pnl = 8;
  google.protobuf.Timestamp opened_at = 9;
  google.protobuf.Timestamp closed_at = 10;
  trading.v1.CloseReason close_reason = 11;
}

// Order state projection.
//
// The projection reuses `trading.v1` enums (single authority): its lifecycle
// is the venue's order lifecycle, so a private `OrderStatus` would only invite
// the same-name/different-number confusion the contract style guide bans.
message Order {
  string id = 1;
  string client_order_id = 2;
  string symbol = 3;
  trading.v1.OrderType type = 4;
  trading.v1.OrderSide side = 5;
  trading.v1.OrderStatus status = 6;
  common.v1.Decimal amount = 7;
  common.v1.Decimal price = 8;
  common.v1.Decimal filled = 9;
  common.v1.Decimal avg_price = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Bracket prices armed on the order. Present for the same reason they are on
  // `trading.v1.Order`: a UI that shows an order's bracket must be able to read
  // it from the projection, not only from a follow-up unary fetch.
  optional common.v1.Decimal take_profit = 13;
  optional common.v1.Decimal stop_loss = 14;
}

// Execution report: one fill event surfaced to the UI.
message ExecutionReport {
  string order_id = 1;
  string symbol = 2;
  trading.v1.OrderSide side = 3;
  trading.v1.OrderStatus status = 4;
  common.v1.Decimal filled_quantity = 5;
  common.v1.Decimal price = 6;
  int64 timestamp_ms = 7;
}

// Runtime health of one venue connection, streamed to the UI.
message RuntimeStatus {
  common.v1.ExchangeId exchange_id = 1;
  bool connected = 2;
  uint64 reconnect_count = 3;
  uint64 lagged_count = 4;
  // Latency metrics in milliseconds; a statistic, not an amount.
  double place_order_p99_ms = 5;
  double msg_per_sec = 6;
  int64 uptime_secs = 7;
}

// One streamed update. Exactly one `payload` variant is populated per
// message; `resume_token` carries the replay cursor for reconnects.
message UpdateEnvelope {
  // Monotonic, gap-free per subscription; a gap requires a resync.
  uint64 seq = 21;
  // Bucket this envelope belongs to (server-side bucketed broadcast).
  TopicClass topic_class = 22;
  oneof payload {
    Tick tick = 1;
    BookSnapshot book = 2;
    Trade trade = 3;
    Liquidation liquidation = 4;
    OrderbookDelta book_delta = 5;
    MyOrderPosition my_order = 6;
    Position position = 7;
    ClosedPosition position_closed = 8;
    Order order = 9;
    Account account = 10;
    // Snapshot market data, borrowed from `market.v1` rather than duplicated.
    market.v1.Ticker ticker = 11;
    market.v1.FundingRate funding_rate = 12;
    ExecutionReport execution = 13;
    RuntimeStatus runtime_status = 14;
  }
  // Opaque token from a previous stream's last event; empty starts fresh.
  string resume_token = 20;
}

message StreamUpdatesRequest {
  // Venue selector; empty resolves to the backend's single active venue.
  common.v1.ExchangeId exchange_id = 1;
  // Symbol filter; empty subscribes to every symbol the venue streams.
  repeated string symbols = 2;
  // Bucket filter; empty subscribes to every bucket.
  repeated TopicClass topics = 3;
}

service StreamService {
  // Stream all update classes as tagged envelopes.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc StreamUpdates(StreamUpdatesRequest) returns (stream UpdateEnvelope);
}
