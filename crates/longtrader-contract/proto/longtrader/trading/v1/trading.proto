syntax = "proto3";

package longtrader.trading.v1;

import "longtrader/common/v1/types.proto";
import "longtrader/account/v1/account.proto";
import "google/protobuf/timestamp.proto";

// Trading service: unified surface for account / positions / orders.
service TradingService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc CreateOrders(CreateOrdersRequest) returns (CreateOrdersResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc CancelAllOrders(CancelAllOrdersRequest) returns (CancelAllOrdersResponse);
  rpc FetchOpenOrders(FetchOpenOrdersRequest) returns (FetchOpenOrdersResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc GetPositions(GetPositionsRequest) returns (GetPositionsResponse);
  rpc GetOrderHistory(GetOrderHistoryRequest) returns (GetOrderHistoryResponse);
  rpc GetClosedPositions(GetClosedPositionsRequest) returns (GetClosedPositionsResponse);
  rpc ClosePosition(ClosePositionRequest) returns (ClosePositionResponse);
  rpc CloseAllPositions(CloseAllPositionsRequest) returns (CloseAllPositionsResponse);
  rpc ModifyPosition(ModifyPositionRequest) returns (ModifyPositionResponse);
  // Venue-side conditional orders (a crash-safe stop backstop). Separate from
  // `OrderRequest.trigger_price`, which is a stop order on the main book.
  rpc CreateTriggerOrder(CreateTriggerOrderRequest) returns (CreateTriggerOrderResponse);
  rpc CancelTriggerOrder(CancelTriggerOrderRequest) returns (CancelTriggerOrderResponse);
  rpc ListTriggerOrders(ListTriggerOrdersRequest) returns (ListTriggerOrdersResponse);
  // Wallet ledger: deposits, withdrawals and internal transfers.
  rpc FetchLedgerEntries(FetchLedgerEntriesRequest) returns (FetchLedgerEntriesResponse);
  rpc Transfer(TransferRequest) returns (TransferResponse);
}

message CreateOrderRequest {
  common.v1.ExchangeId exchange_id = 1;
  OrderRequest order = 2;
  // Session that submits the order, as issued by `worker.v1.AttachSession`.
  //
  // When non-empty the host binds the order to that session: the submission is
  // rejected with reason `SYNC_IN_PROGRESS` unless the session is ACTIVE, and
  // the resulting order id is recorded so `KillSwitchPolicy.SCOPE_SESSION_ORDERS`
  // and `StopStrategy.cancel_open_orders` can cancel exactly this session's
  // orders. When empty the call is an unscoped operator action (the CLI) and is
  // neither gated nor tracked.
  string session_id = 3;
}

message CreateOrderResponse {
  Order order = 1;
}

message CreateOrdersRequest {
  common.v1.ExchangeId exchange_id = 1;
  repeated OrderRequest orders = 2;
  // Same session binding semantics as `CreateOrderRequest.session_id`;
  // an all-or-nothing gate applies to the whole batch.
  string session_id = 3;
}

message CreateOrdersResponse {
  repeated Order orders = 1;
}

message CancelOrderRequest {
  common.v1.ExchangeId exchange_id = 1;
  string order_id = 2;
  string symbol = 3;
}

message CancelOrderResponse {
  Order order = 1;
}

message CancelAllOrdersRequest {
  common.v1.ExchangeId exchange_id = 1;
  // Empty cancels across all symbols.
  string symbol = 2;
}

message CancelAllOrdersResponse {
  repeated Order orders = 1;
}

message FetchOpenOrdersRequest {
  common.v1.ExchangeId exchange_id = 1;
  string symbol = 2;
  common.v1.Pagination pagination = 3;
}

message FetchOpenOrdersResponse {
  repeated Order orders = 1;
  common.v1.Page page = 2;
}

message GetAccountRequest {
  common.v1.ExchangeId exchange_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message GetPositionsRequest {
  common.v1.ExchangeId exchange_id = 1;
  repeated string symbols = 2;
}

message GetPositionsResponse {
  repeated Position positions = 1;
}

message GetOrderHistoryRequest {
  common.v1.ExchangeId exchange_id = 1;
  common.v1.Pagination pagination = 2;
}

message GetOrderHistoryResponse {
  repeated Order orders = 1;
  common.v1.Page page = 2;
}

message GetClosedPositionsRequest {
  common.v1.ExchangeId exchange_id = 1;
  common.v1.Pagination pagination = 2;
}

message GetClosedPositionsResponse {
  repeated ClosedPosition positions = 1;
  common.v1.Page page = 2;
}

message ClosePositionRequest {
  common.v1.ExchangeId exchange_id = 1;
  string position_id = 2;
}

message ClosePositionResponse {
  Position position = 1;
}

message CloseAllPositionsRequest {
  common.v1.ExchangeId exchange_id = 1;
}

message CloseAllPositionsResponse {}

// Edits the take-profit / stop-loss of an open position. A `None` field leaves
// the corresponding bracket unchanged.
message ModifyPositionRequest {
  common.v1.ExchangeId exchange_id = 1;
  string position_id = 2;
  optional common.v1.Decimal take_profit = 3;
  optional common.v1.Decimal stop_loss = 4;
}

message ModifyPositionResponse {
  Position position = 1;
}

message OrderRequest {
  string client_order_id = 1;
  string symbol = 2;
  OrderType type = 3;
  OrderSide side = 4;
  common.v1.Decimal amount = 5;
  common.v1.Decimal price = 6;
  common.v1.Decimal trigger_price = 7;
  TimeInForce time_in_force = 8;
  bool post_only = 9;
  bool reduce_only = 10;
  map<string, string> params = 11;
  // Bracket prices attached at submission. Mirrors `Order.take_profit` /
  // `Order.stop_loss`, which already existed as terminal extensions; without
  // them here a caller could place an order but not arm its bracket, and the
  // terminal's flat place-order surface would have to be kept alive just for
  // these two fields.
  optional common.v1.Decimal take_profit = 12;
  optional common.v1.Decimal stop_loss = 13;
}

message Order {
  string id = 1;
  string client_order_id = 2;
  string symbol = 3;
  OrderType type = 4;
  OrderSide side = 5;
  OrderStatus status = 6;
  common.v1.Decimal amount = 7;
  common.v1.Decimal price = 8;
  common.v1.Decimal filled = 9;
  common.v1.Decimal remaining = 10;
  common.v1.Decimal cost = 11;
  common.v1.Decimal average = 12;
  common.v1.Decimal fee = 13;
  string fee_currency = 14;
  TimeInForce time_in_force = 15;
  google.protobuf.Timestamp timestamp = 16;
  google.protobuf.Timestamp last_trade_timestamp = 17;
  bool post_only = 18;
  bool reduce_only = 19;
  map<string, string> info = 20;
  // ---- Terminal extensions (additive) ----
  // Creation / last update.
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
  optional common.v1.Decimal take_profit = 24;
  optional common.v1.Decimal stop_loss = 25;
}

message Account {
  common.v1.Decimal balance = 1;
  common.v1.Decimal equity = 2;
  common.v1.Decimal margin_used = 3;
  common.v1.Decimal free_margin = 4;
  common.v1.Decimal margin_frozen = 5;
}

message Trade {
  string id = 1;
  string order_id = 2;
  string symbol = 3;
  OrderSide side = 4;
  common.v1.Decimal price = 5;
  common.v1.Decimal amount = 6;
  common.v1.Decimal cost = 7;
  common.v1.Decimal fee = 8;
  string fee_currency = 9;
  google.protobuf.Timestamp timestamp = 10;
  bool maker = 11;
}

message Position {
  string id = 1;
  string symbol = 2;
  common.v1.Decimal contracts = 3;
  common.v1.Decimal contract_size = 4;
  OrderSide side = 5;
  common.v1.Decimal entry_price = 6;
  common.v1.Decimal mark_price = 7;
  common.v1.Decimal unrealized_pnl = 8;
  // Absent when the venue does not report the originating order.
  optional string order_id = 9;
  common.v1.Decimal current_price = 10;
  google.protobuf.Timestamp timestamp = 11;
  // Bracket orders attached to the position. `ModifyPosition` leaves a
  // bracket unchanged when the request field is absent; an unset bracket
  // simply means "not set".
  optional common.v1.Decimal take_profit = 12;
  optional common.v1.Decimal stop_loss = 13;
  // Position open time.
  google.protobuf.Timestamp opened_at = 17;
}

// Position side as seen from the holder's perspective. Single authority for
// position sides; reuse this enum rather than defining a sibling.
enum PositionSide {
  POSITION_SIDE_UNSPECIFIED = 0;
  POSITION_SIDE_LONG = 1;
  POSITION_SIDE_SHORT = 2;
}

// Canonical reason a position/order was closed. This is the single authority for
// close reasons across the contract — do not introduce a parallel enum.
enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  CLOSE_REASON_MANUAL = 1;
  CLOSE_REASON_TAKE_PROFIT = 2;
  CLOSE_REASON_STOP_LOSS = 3;
  CLOSE_REASON_STOP_OUT = 4;
}

message ClosedPosition {
  string id = 1;
  string order_id = 2;
  string symbol = 3;
  PositionSide side = 4;
  common.v1.Decimal quantity = 5;
  common.v1.Decimal entry_price = 6;
  common.v1.Decimal exit_price = 7;
  common.v1.Decimal realized_pnl = 8;
  google.protobuf.Timestamp opened_at = 9;
  google.protobuf.Timestamp closed_at = 10;
  CloseReason close_reason = 11;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_OPEN = 1;
  ORDER_STATUS_FILLED = 2;
  ORDER_STATUS_CANCELED = 3;
  ORDER_STATUS_REJECTED = 4;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
  TIME_IN_FORCE_GTD = 4;
}

// ---- Venue-side conditional (trigger) orders ----
//
// A trigger order rests on the venue's own matching engine and fires when the
// market crosses the trigger price, even if the strategy process is dead. It is
// therefore the only reliable stop backstop, and is deliberately a different
// surface from `OrderRequest.trigger_price`, which places a stop order on the
// main book through the strategy's own session.

enum TriggerOrderStatus {
  TRIGGER_ORDER_STATUS_UNSPECIFIED = 0;
  // Resting at the venue, waiting for the trigger price.
  TRIGGER_ORDER_STATUS_OPEN = 1;
  // Trigger fired; `order_id` names the resulting order.
  TRIGGER_ORDER_STATUS_TRIGGERED = 2;
  TRIGGER_ORDER_STATUS_CANCELED = 3;
  TRIGGER_ORDER_STATUS_REJECTED = 4;
}

// What the venue does once the trigger price is crossed.
enum TriggerPriceType {
  TRIGGER_PRICE_TYPE_UNSPECIFIED = 0;
  TRIGGER_PRICE_TYPE_LAST = 1;
  TRIGGER_PRICE_TYPE_MARK = 2;
  TRIGGER_PRICE_TYPE_INDEX = 3;
}

message TriggerOrderRequest {
  // Optional idempotency key; the venue dedupes on it when supplied.
  string client_order_id = 1;
  string symbol = 2;
  OrderSide side = 3;
  common.v1.Decimal trigger_price = 4;
  common.v1.Decimal qty = 5;
  // When true the order may only reduce exposure, never open a new one.
  bool reduce_only = 6;
  // Defaults to LAST when unspecified.
  TriggerPriceType trigger_type = 7;
  // Limit price used after the trigger. When unset the venue submits a market
  // order, which carries slippage risk the caller should opt into knowingly.
  optional common.v1.Decimal order_price = 8;
  // Order type used after the trigger. Defaults to LIMIT when `order_price`
  // is set and MARKET otherwise.
  OrderType order_type = 9;
}

message TriggerOrder {
  string id = 1;
  string client_order_id = 2;
  string symbol = 3;
  OrderSide side = 4;
  common.v1.Decimal trigger_price = 5;
  common.v1.Decimal qty = 6;
  TriggerPriceType trigger_type = 7;
  optional common.v1.Decimal order_price = 8;
  OrderType order_type = 9;
  bool reduce_only = 10;
  TriggerOrderStatus status = 11;
  google.protobuf.Timestamp created_at = 12;
  // Set when the trigger fired; names the resulting order.
  optional string order_id = 13;
  optional google.protobuf.Timestamp triggered_at = 14;
}

message CreateTriggerOrderRequest {
  common.v1.ExchangeId exchange_id = 1;
  TriggerOrderRequest order = 2;
  // Same session binding semantics as `CreateOrderRequest.session_id`: a
  // non-empty value is rejected with `failed_precondition` /
  // `SYNC_IN_PROGRESS` unless that session is `ACTIVE`.
  //
  // Conditional orders deliberately survive the kill-switch — that is what
  // makes one a usable crash backstop — so the session id gates *placement*,
  // it does not make the order attributable for cancellation.
  string session_id = 3;
}

message CreateTriggerOrderResponse {
  TriggerOrder order = 1;
}

message CancelTriggerOrderRequest {
  common.v1.ExchangeId exchange_id = 1;
  string order_id = 2;
  string symbol = 3;
}

message CancelTriggerOrderResponse {
  TriggerOrder order = 1;
}

message ListTriggerOrdersRequest {
  common.v1.ExchangeId exchange_id = 1;
  // Empty lists trigger orders across every symbol.
  repeated string symbols = 2;
}

message ListTriggerOrdersResponse {
  repeated TriggerOrder orders = 1;
}

// ---- Wallet ledger and transfers ----

message FetchLedgerEntriesRequest {
  common.v1.ExchangeId exchange_id = 1;
  // Restrict to one currency; empty returns every currency.
  string currency = 2;
  // Restrict to one `LedgerEntry.type` (e.g. "deposit"); empty returns all.
  string type = 3;
  common.v1.Pagination pagination = 4;
}

message FetchLedgerEntriesResponse {
  // Newest first.
  repeated account.v1.LedgerEntry entries = 1;
  common.v1.Page page = 2;
}

message TransferRequest {
  common.v1.ExchangeId exchange_id = 1;
  string asset = 2;
  common.v1.Decimal amount = 3;
  // Same session binding semantics as `CreateOrderRequest.session_id`. A
  // transfer moves real funds, so a session-scoped call is rejected with
  // `failed_precondition` / `SYNC_IN_PROGRESS` unless that session is
  // `ACTIVE`. An empty value marks an unscoped operator call.
  // Destination account label, as reported by the venue's account listing
  // (e.g. "spot", "futures", or a named sub-account).
  string dest_label = 4;
  // Optional idempotency key. Transfers move funds, so a retry without one
  // risks a double spend; supply it whenever the caller can retry.
  string client_transfer_id = 5;
  string session_id = 6;
}

message TransferResponse {
  // Venue-assigned transfer id, empty when the venue does not report one.
  string transfer_id = 1;
  // Absent when the venue does not report a resulting ledger entry.
  optional account.v1.LedgerEntry entry = 2;
}
