[package]
name = "longtrader-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://docs.rs/longtrader-proto"
readme = "../../README.md"
description = "Connect-RPC protocol definitions and client for longtrader.terminal.v1"
documentation = "https://docs.rs/longtrader-proto"
keywords = ["trading", "connectrpc", "protobuf", "grpc", "finance"]
categories = ["api-bindings", "finance"]

[package.metadata.cargo-shear]
ignored = ["serde", "serde_json"]

[features]
default = []
client-native = ["dep:hpx", "dep:futures-util"]

[dependencies]
buffa = { workspace = true, features = ["json"] }
futures-util = { workspace = true, optional = true }
hpx = { workspace = true, optional = true }
longtrader-contract = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true
