[package]
name = "longtrader-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

authors.workspace = true
homepage = "https://docs.rs/longtrader-cli"
readme = "../../README.md"
description = "Connect-RPC CLI client for longtrader-api (longtrader.terminal.v1)"
documentation = "https://docs.rs/longtrader-cli"
keywords = ["trading", "cli", "connectrpc", "finance", "grpc"]
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "longtrader"
path = "src/main.rs"

[dependencies]
buffa.workspace = true
clap = { workspace = true, features = ["derive"] }
color-eyre.workspace = true
futures-util.workspace = true
longtrader-proto = { workspace = true, features = ["client-native"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ulid.workspace = true

[lints]
workspace = true
