[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longtrader-sdk"
version = "0.1.0"
description = "Thin Python wrapper over the longtrader Connect contract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LongCipher" }]
keywords = ["trading", "connectrpc", "protobuf", "finance", "grpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "protobuf>=5",
]

[project.urls]
Homepage = "https://github.com/longcipher/longtrader"
Repository = "https://github.com/longcipher/longtrader"
Documentation = "https://github.com/longcipher/longtrader#readme"
Issues = "https://github.com/longcipher/longtrader/issues"

[tool.hatch.build.targets.wheel]
packages = ["longtrader_sdk"]
