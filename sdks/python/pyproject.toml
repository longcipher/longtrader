[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longtrader-sdk"
version = "0.1.0"
description = "Thin Python wrapper over the longtrader Connect contract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "protobuf>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["longtrader_sdk"]
